[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "web-agent"
version = "0.1.0"
description = "Self-hosted personal web AI agent platform with MCP, task queue and Canvas"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "mcp>=1.13,<2",
  "aiosqlite>=0.20,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "psutil>=6,<8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]

[project.scripts]
web-agent-server = "web_mcp.server:main"
web-agent-worker = "web_worker.daemon:main"

[tool.setuptools]
packages = [
  "web_mcp",
  "web_worker",
  "web_canvas",
  "web_memory",
  "web_tools",
  "web_config",
  "web_logs",
]

[tool.setuptools.package-dir]
web_mcp = "02_web_mcp/web_mcp"
web_worker = "03_web_worker/web_worker"
web_canvas = "04_web_canvas/web_canvas"
web_memory = "05_web_memory/web_memory"
web_tools = "06_web_tools/web_tools"
web_config = "07_web_config/web_config"
web_logs = "09_web_logs/web_logs"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [
  "02_web_mcp",
  "03_web_worker",
  "04_web_canvas",
  "05_web_memory",
  "06_web_tools",
  "07_web_config",
]