<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Xiaoruo1 Edge Bridge</title>
  <style>
    body { width: 260px; margin: 0; padding: 16px; font: 14px/1.5 system-ui, sans-serif; color: #1f2937; }
    h1 { margin: 0 0 10px; font-size: 16px; }
    #status { padding: 10px; border-radius: 8px; background: #f3f4f6; }
    .on { color: #15803d; } .off { color: #6b7280; }
    button { margin-top: 12px; width: 100%; padding: 8px; border: 0; border-radius: 7px; background: #2563eb; color: white; cursor: pointer; }
    small { display: block; margin-top: 10px; color: #6b7280; }
  </style>
</head>
<body>
  <h1>Xiaoruo1 Edge Bridge</h1>
  <div id="status">检查连接中…</div>
  <button id="reconnect">重新连接</button>
  <small>仅通过 127.0.0.1 连接本机 MCP；不会读取或导出 Cookie。</small>
  <script src="popup.js"></script>
</body>
</html>
